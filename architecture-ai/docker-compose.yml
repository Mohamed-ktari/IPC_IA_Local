# docker-compose.yml
# Defines all infrastructure services the backend depends on.
# Run with: make docker-up
# All services communicate on the internal "ai-network" bridge.
# Nothing is exposed to the internet except through explicit port mappings.

services:

  # ────────────────────────────────────────
  # OLLAMA — local LLM runtime
  # ────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"         # exposes Ollama API to the host
    volumes:
      - ollama_data:/root/.ollama   # persists downloaded models
    environment:
      - OLLAMA_KEEP_ALIVE=24h       # keeps model loaded in memory
    networks:
      - ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ────────────────────────────────────────
  # CHROMADB — vector database
  # ────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"           # chromadb runs on 8000 internally, mapped to 8001
    volumes:
      - chroma_data:/chroma/chroma   # persists embedded documents
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE   # no usage data sent to Chroma
    networks:
      - ai-network

  # ────────────────────────────────────────
  # REDIS — task queue + cache
  # ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - ai-network

  # ────────────────────────────────────────
  # POSTGRES — users, audit logs, metadata
  # ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-architecture_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-network

  # ────────────────────────────────────────
  # BACKEND — FastAPI app (agents, RAG, ingestion)
  # ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Loads every key from the root .env as baseline env vars inside the
    # container — never copied into the image, only injected at runtime.
    # Keys below in `environment:` override these where host != container
    # values differ (service DNS names instead of localhost, internal
    # ports instead of host-mapped ports).
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-archai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-architecture_ai}
      - REDIS_URL=redis://redis:6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000              # chromadb's internal container port, not the 8001 host mapping
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      # Persist uploads/chroma/logs on the host so they survive container
      # rebuilds — paths match settings.upload_path / chroma_path /
      # audit_log_path defaults (BASE_DIR/backend/data/...).
      - ./backend/data/uploads:/app/data/uploads
      - ./backend/data/chroma:/app/data/chroma
      - ./backend/data/logs:/app/data/logs
    depends_on:
      - postgres
      - redis
      - chromadb
      - ollama
    networks:
      - ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ────────────────────────────────────────
  # FRONTEND — static HTML/CSS/JS app, served by Nginx
  # ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    # No host port mapping needed — only Caddy talks to this container,
    # over the internal ai-network, same pattern as backend/chromadb/etc.
    networks:
      - ai-network

  # ────────────────────────────────────────
  # Open WebUI — Frontend for interacting with the backend and LLMs
  # ────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - ai-network

    
  # ────────────────────────────────────────
  # SEARXNG — self-hosted web search
  # ────────────────────────────────────────
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng_cache:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-this-secret}
    networks:
      - ai-network
  
  # ────────────────────────────────────────
  # CADDY — Reverse proxy
  # ────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - ai-network

# ────────────────────────────────────────
# VOLUMES — persistent data survives container restarts
# ────────────────────────────────────────
volumes:
  ollama_data:
  chroma_data:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
  open_webui_data:
  searxng_cache:

# ────────────────────────────────────────
# NETWORK — isolated internal bridge
# All services talk to each other by container name
# e.g. backend connects to ollama at http://ollama:11434
# ────────────────────────────────────────
networks:
  ai-network:
    driver: bridge