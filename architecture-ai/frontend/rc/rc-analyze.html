<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Analysis</title>

    <style>
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        input, select, textarea {
            padding: 11px 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #0d6efd;
            color: white;
        }

        .btn-primary:hover {
            background: #0b5ed7;
        }

        .btn-primary:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .btn-success {
            background: #198754;
            color: white;
        }

        .btn-success:hover {
            background: #157347;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .message {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 500;
            display: none;
        }

        .message.error {
            background: #f8d7da;
            color: #842029;
            display: block;
        }

        .message.success {
            background: #d1e7dd;
            color: #0f5132;
            display: block;
        }

        /* Results */
        #results {
            display: none;
            margin-top: 35px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }

        .result-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }

        .result-card h4 {
            margin: 0 0 10px 0;
            color: #333;
        }

        .result-card p, .result-card pre {
            margin: 0;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #444;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #ddd;
            border-top: 4px solid #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>RC Analysis</h2>

    <form id="analyzeForm">
        <div class="form-group">
            <label for="docId">Document ID *</label>
            <input type="text" id="docId" required placeholder="Paste the doc_id here">
        </div>

        <div class="form-group">
            <label for="userPrompt">Your Prompt</label>
            <textarea id="userPrompt" placeholder="Optional: give specific instructions to the LLM (e.g. focus on certain sections, style, length...)"></textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary" id="analyzeBtn">
                Analyze RC
            </button>
        </div>
    </form>

    <div id="loading">
        <div class="spinner"></div>
        <p>Analyzing document... This may take a moment.</p>
    </div>

    <div id="message" class="message"></div>

    <!-- Results -->
    <div id="results">
        <h3>Analysis Results</h3>

        <div class="result-card">
            <h4>Summary</h4>
            <p id="summaryText">—</p>
        </div>

        <div class="result-card">
            <h4>Structure</h4>
            <pre id="structureText">—</pre>
        </div>

        <div class="result-card">
            <h4>Intent</h4>
            <pre id="intentText">—</pre>
        </div>

        <div class="actions" style="margin-top: 20px;">
            <a id="downloadBtn" href="#" class="btn btn-success" style="display:none;">
                Download Generated DOCX
            </a>
        </div>
    </div>
</div>

<script src="../nav/nav.js"></script>

<script>
const API_BASE = "http://192.168.99.10:8000";

const form = document.getElementById("analyzeForm");
const analyzeBtn = document.getElementById("analyzeBtn");
const loading = document.getElementById("loading");
const messageEl = document.getElementById("message");
const results = document.getElementById("results");
const downloadBtn = document.getElementById("downloadBtn");

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const docId = document.getElementById("docId").value.trim();
    const userPrompt = document.getElementById("userPrompt").value.trim();

    if (!docId) {
        showMessage("Document ID is required.", "error");
        return;
    }

    // Reset UI
    results.style.display = "none";
    downloadBtn.style.display = "none";
    messageEl.style.display = "none";
    loading.style.display = "block";
    analyzeBtn.disabled = true;
    analyzeBtn.textContent = "Analyzing...";

    try {
        const res = await fetch(`${API_BASE}/rc/analyze`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                doc_id: docId,
                user_prompt: userPrompt
            })
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `Error ${res.status}`);
        }

        const data = await res.json();

        // Fill results
        document.getElementById("summaryText").textContent = data.summary || "—";

        // Structure
        const structure = data.structure || {};
        document.getElementById("structureText").textContent = 
            `Found: ${structure.found}\n` +
            `Heading: ${structure.heading || "—"}\n` +
            `Match score: ${structure.match_score ?? "—"}\n` +
            `Raw text: ${structure.raw_text || "—"}\n` +
            `Structure: ${structure.structure || "—"}`;

        // Intent
        const intent = data.intent || {};
        document.getElementById("intentText").textContent =
            `Target section: ${intent.target_section_label || "—"}\n` +
            `Emphasis: ${intent.emphasis_instructions || "—"}`;

        // Download button
        if (data.docx_path || data.doc_id) {
            // Use the download endpoint
            downloadBtn.href = `${API_BASE}/rc/download/${data.doc_id || docId}`;
            downloadBtn.style.display = "inline-block";
            downloadBtn.download = ""; // let the browser handle the filename
        }

        results.style.display = "block";
        showMessage("Analysis completed successfully.", "success");

    } catch (err) {
        console.error(err);
        showMessage(err.message || "Analysis failed.", "error");
    } finally {
        loading.style.display = "none";
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = "Analyze RC";
    }
});

function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = `message ${type}`;
}
</script>

</body>
</html>
