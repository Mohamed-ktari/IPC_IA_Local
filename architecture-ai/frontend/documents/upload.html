<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Documents</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f8f9fa;
        }

        .container {
            max-width: 520px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        input[type="file"],
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: #0056b3;
        }

        #fileList {
            margin-top: 18px;
            font-size: 14px;
            color: #444;
            background: #f1f3f5;
            padding: 12px 15px;
            border-radius: 6px;
            display: none;
        }

        #fileList ul {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        #fileList li {
            margin-bottom: 4px;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 25px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        #currentFile {
            font-weight: 600;
            color: #007bff;
            margin-top: 6px;
        }

        #message {
            margin-top: 20px;
            font-weight: 500;
            line-height: 1.5;
        }

        .success { color: #198754; }
        .error   { color: #dc3545; }
    </style>
</head>
<body>
<script src="../nav/nav.js"></script>
<div class="container">
    <h2>Upload Documents</h2>

    <form id="uploadForm">
        <input
            type="file"
            id="document"
            accept=".pdf,.doc,.docx,.xls,.xlsx"
            required
            multiple
        />

        <div id="fileList"></div>

        <button type="submit">Upload</button>
    </form>

    <div id="loading">
        <div class="spinner"></div>
        <p>Uploading documents...</p>
        <div id="currentFile"></div>
    </div>

    <div id="message"></div>
</div>

<script>
const UPLOAD_API = "http://192.168.99.10:8000/documents/upload";

const fileInput   = document.getElementById("document");
const fileListDiv = document.getElementById("fileList");
const form        = document.getElementById("uploadForm");
const loading     = document.getElementById("loading");
const currentFile = document.getElementById("currentFile");
const message     = document.getElementById("message");
const submitBtn   = form.querySelector("button[type='submit']");

// Show selected files (max 10 + "...")
fileInput.addEventListener("change", function () {
    const files = Array.from(this.files);

    if (files.length === 0) {
        fileListDiv.style.display = "none";
        fileListDiv.innerHTML = "";
        return;
    }

    let html = `<strong>${files.length} file(s) selected:</strong><ul>`;

    const displayCount = Math.min(files.length, 10);

    for (let i = 0; i < displayCount; i++) {
        html += `<li>${files[i].name}</li>`;
    }

    if (files.length > 10) {
        html += `<li>... and ${files.length - 10} more</li>`;
    }

    html += `</ul>`;
    fileListDiv.innerHTML = html;
    fileListDiv.style.display = "block";
});

// Upload files one by one
form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const files = Array.from(fileInput.files);

    if (files.length === 0) {
        alert("Please select at least one file");
        return;
    }

    // Reset UI
    message.innerHTML = "";
    loading.style.display = "block";
    submitBtn.disabled = true;
    submitBtn.textContent = "Uploading...";

    let successCount = 0;
    let errorCount = 0;
    const results = [];

    for (let i = 0; i < files.length; i++) {
        const file = files[i];

        // Show which file is currently being processed
        currentFile.textContent = `Processing: ${file.name} (${i + 1}/${files.length})`;

        const formData = new FormData();
        formData.append("file", file);   // keep the same key as your original API

        try {
            const response = await fetch(UPLOAD_API, {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error(`Server returned ${response.status}`);
            }

            successCount++;
            results.push(`✅ ${file.name}`);
        } catch (err) {
            errorCount++;
            results.push(`❌ ${file.name} — ${err.message}`);
        }
    }

    // Finished
    loading.style.display = "none";
    submitBtn.disabled = false;
    submitBtn.textContent = "Upload";
    currentFile.textContent = "";

    // Final summary
    let summary = `<div class="${errorCount === 0 ? 'success' : 'error'}">`;
    summary += `<strong>Upload finished</strong><br>`;
    summary += `${successCount} succeeded, ${errorCount} failed.<br><br>`;
    summary += results.join("<br>");
    summary += `</div>`;

    message.innerHTML = summary;

    // Clear selection
    fileInput.value = "";
    fileListDiv.style.display = "none";
    fileListDiv.innerHTML = "";
});
</script>

</body>
</html>
