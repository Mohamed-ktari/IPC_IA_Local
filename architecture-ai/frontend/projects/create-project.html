<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project</title>

    <style>
        .container {
            max-width: 560px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        input {
            padding: 11px 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #198754;
            color: white;
        }

        .btn-primary:hover {
            background: #157347;
        }

        .btn-primary:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5c636a;
        }

        .message {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #d1e7dd;
            color: #0f5132;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #842029;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Project</h2>

    <form id="createForm">
        <div class="form-group">
            <label for="name">Project Name *</label>
            <input type="text" id="name" required placeholder="e.g. Projet Mémoire 2026">
        </div>

        <div class="form-group">
            <label for="clientName">Client Name</label>
            <input type="text" id="clientName" placeholder="e.g. Client ABC">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
                Create Project
            </button>
            <a href="projects.html" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

    <div id="message" class="message"></div>
</div>

<script src="../nav/nav.js"></script>

<script>
const API_BASE = "http://192.168.99.10:8000";

const form = document.getElementById("createForm");
const submitBtn = document.getElementById("submitBtn");
const messageEl = document.getElementById("message");

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const clientName = document.getElementById("clientName").value.trim();

    if (!name) {
        showMessage("Project name is required.", "error");
        return;
    }

    // Loading state
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating...";
    messageEl.style.display = "none";

    try {
        const res = await fetch(`${API_BASE}/projects`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                client_name: clientName || null
            })
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `Error ${res.status}`);
        }

        const project = await res.json();

        showMessage("Project created successfully! Redirecting...", "success");

        // Redirect to the project details page after a short delay
        setTimeout(() => {
            window.location.href = `project-details.html?id=${project.project_id}`;
        }, 900);

    } catch (err) {
        console.error(err);
        showMessage(err.message || "Failed to create project.", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Project";
    }
});

function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = `message ${type}`;
}
</script>

</body>
</html>
