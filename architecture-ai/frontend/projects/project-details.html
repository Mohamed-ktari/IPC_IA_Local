<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>

    <style>
        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h2, h3 {
            color: #333;
            margin-top: 0;
        }

        .section {
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #444;
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-primary {
            background: #0d6efd;
            color: white;
        }

        .btn-primary:hover {
            background: #0b5ed7;
        }

        .btn-success {
            background: #198754;
            color: white;
        }

        .btn-success:hover {
            background: #157347;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5c636a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            text-transform: capitalize;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-active, .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #d1e7dd;
            color: #0f5132;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #842029;
            display: block;
        }

        .add-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .add-box h4 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        #pageLoading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="pageLoading">Loading project...</div>

    <div id="content" style="display: none;">
        <!-- Project Info -->
        <div class="section">
            <h2 id="projectTitle">Project Details</h2>

            <div class="form-grid">
                <div class="form-group">
                    <label>Project ID</label>
                    <input type="text" id="projectId" disabled>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="pending">Pending</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name">
                </div>

                <div class="form-group">
                    <label>Client Name</label>
                    <input type="text" id="clientName">
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-primary" onclick="saveProject()">Save Changes</button>
                <a href="projects.html" class="btn btn-secondary">← Back to Projects</a>
            </div>

            <div id="saveMessage" class="message"></div>
        </div>

        <!-- Documents -->
        <div class="section">
            <h3>Documents in this Project</h3>

            <table>
                <thead>
                    <tr>
                        <th>Doc ID</th>
                        <th>Original File Name</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="documentsTable"></tbody>
            </table>

            <div id="noDocs" style="display:none; padding:20px; color:#666;">
                No documents linked to this project yet.
            </div>

            <!-- Add Document -->
            <div class="add-box">
                <h4>Upload & Add Documents to Project</h4>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Document Type (applied to all selected files)</label>
                    <select id="docType">
                        <option value="memoire">Memoire</option>
                        <option value="rc">RC</option>
                        <option value="programme">Programme</option>
                        <option value="unspecified">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select Files</label>
                    <input
                        type="file"
                        id="projectFiles"
                        accept=".pdf,.doc,.docx,.xls,.xlsx"
                        multiple
                    />
                </div>

                <div id="fileList" style="display:none; margin-top:12px; font-size:14px; background:#f1f3f5; padding:12px 15px; border-radius:6px;"></div>

                <div style="margin-top: 18px;">
                    <button class="btn btn-success" id="uploadAddBtn" onclick="uploadAndAddDocuments()">
                        Upload & Add to Project
                    </button>
                </div>

                <!-- Upload Spinner -->
                <div id="uploadLoading" style="display:none; text-align:center; margin-top:25px;">
                    <div class="spinner"></div>
                    <p>Uploading documents...</p>
                    <div id="currentFile" style="font-weight:600; color:#007bff; margin-top:6px;"></div>
                </div>

                <div id="addMessage" class="message"></div>
            </div>
        </div>
    </div>
</div>

<script src="../nav/nav.js"></script>

<script>
const API_BASE = "http://192.168.99.10:8000";

const urlParams = new URLSearchParams(window.location.search);
const projectId = urlParams.get("id");

if (!projectId) {
    alert("No project ID provided");
    window.location.href = "projects.html";
}

let currentProject = null;

async function init() {
    try {
        const res = await fetch(`${API_BASE}/projects/${projectId}`);
        if (!res.ok) throw new Error("Failed to load project");

        currentProject = await res.json();

        renderProject();
        renderDocuments();

        document.getElementById("pageLoading").style.display = "none";
        document.getElementById("content").style.display = "block";

    } catch (err) {
        console.error(err);
        document.getElementById("pageLoading").innerHTML = "Failed to load project.";
    }
}

function renderProject() {
    document.getElementById("projectTitle").textContent = currentProject.name || "Project Details";
    document.getElementById("projectId").value = currentProject.project_id || "";
    document.getElementById("name").value = currentProject.name || "";
    document.getElementById("clientName").value = currentProject.client_name || "";
    document.getElementById("status").value = currentProject.status || "pending";
}

function renderDocuments() {
    const tbody = document.getElementById("documentsTable");
    const noDocs = document.getElementById("noDocs");
    const docs = currentProject.documents || [];

    tbody.innerHTML = "";

    if (docs.length === 0) {
        noDocs.style.display = "block";
        return;
    }

    noDocs.style.display = "none";

    docs.forEach(doc => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td style="font-size:13px;">${doc.doc_id}</td>
            <td>${doc.original_file_name || "-"}</td>
            <td>${doc.doc_type || "-"}</td>
            <td>
                <button class="btn btn-danger" style="padding:6px 12px; font-size:13px;"
                        onclick="removeDocument('${doc.doc_id}')">
                    Remove
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Show selected files
document.getElementById("projectFiles").addEventListener("change", function () {
    const files = Array.from(this.files);
    const fileListDiv = document.getElementById("fileList");

    if (files.length === 0) {
        fileListDiv.style.display = "none";
        fileListDiv.innerHTML = "";
        return;
    }

    let html = `<strong>${files.length} file(s) selected:</strong><ul style="margin:8px 0 0 0; padding-left:20px;">`;
    const displayCount = Math.min(files.length, 10);

    for (let i = 0; i < displayCount; i++) {
        html += `<li>${files[i].name}</li>`;
    }
    if (files.length > 10) {
        html += `<li>... and ${files.length - 10} more</li>`;
    }
    html += `</ul>`;

    fileListDiv.innerHTML = html;
    fileListDiv.style.display = "block";
});

async function uploadAndAddDocuments() {
    const fileInput = document.getElementById("projectFiles");
    const files = Array.from(fileInput.files);
    const docType = document.getElementById("docType").value;
    const messageEl = document.getElementById("addMessage");
    const loading = document.getElementById("uploadLoading");
    const currentFileEl = document.getElementById("currentFile");
    const uploadBtn = document.getElementById("uploadAddBtn");

    messageEl.className = "message";
    messageEl.style.display = "none";

    if (files.length === 0) {
        messageEl.textContent = "Please select at least one file.";
        messageEl.classList.add("error");
        return;
    }

    // UI loading state
    loading.style.display = "block";
    uploadBtn.disabled = true;
    uploadBtn.textContent = "Uploading...";

    let successCount = 0;
    let errorCount = 0;
    const results = [];

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        currentFileEl.textContent = `Processing: ${file.name} (${i + 1}/${files.length})`;

        try {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("doc_type", docType);

            const res = await fetch(`${API_BASE}/projects/${projectId}/documents`, {
                method: "POST",
                body: formData
            });

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.detail || `Failed (${res.status})`);
            }

            // The endpoint returns the updated project → use it
            currentProject = await res.json();
            successCount++;
            results.push(`✅ ${file.name}`);

            // Re-render the table after each successful upload
            renderDocuments();

        } catch (err) {
            errorCount++;
            results.push(`❌ ${file.name} — ${err.message}`);
        }
    }

    // Finished
    loading.style.display = "none";
    uploadBtn.disabled = false;
    uploadBtn.textContent = "Upload & Add to Project";
    currentFileEl.textContent = "";

    // Show summary
    let summary = `<strong>Finished</strong><br>${successCount} succeeded, ${errorCount} failed.<br><br>`;
    summary += results.join("<br>");

    messageEl.innerHTML = summary;
    messageEl.classList.add(errorCount === 0 ? "success" : "error");

    // Clear file input + list
    fileInput.value = "";
    document.getElementById("fileList").style.display = "none";
    document.getElementById("fileList").innerHTML = "";
}
async function saveProject() {
    const messageEl = document.getElementById("saveMessage");
    messageEl.className = "message";
    messageEl.style.display = "none";

    const payload = {
        name: document.getElementById("name").value.trim(),
        client_name: document.getElementById("clientName").value.trim(),
        status: document.getElementById("status").value
    };

    try {
        const res = await fetch(`${API_BASE}/projects/${projectId}`, {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Update failed");

        const updated = await res.json();
        currentProject = { ...currentProject, ...updated };

        document.getElementById("projectTitle").textContent = currentProject.name;

        messageEl.textContent = "Project updated successfully!";
        messageEl.classList.add("success");

    } catch (err) {
        console.error(err);
        messageEl.textContent = "Failed to update project.";
        messageEl.classList.add("error");
    }
}

async function removeDocument(docId) {
    if (!confirm("Remove this document from the project?")) return;

    try {
        const res = await fetch(`${API_BASE}/projects/${projectId}/documents/${docId}`, {
            method: "DELETE"
        });

        if (!res.ok) throw new Error("Failed to remove document");

        // Update local data
        currentProject.documents = (currentProject.documents || []).filter(d => d.doc_id !== docId);
        renderDocuments();

    } catch (err) {
        console.error(err);
        alert("Failed to remove document.");
    }
}

// Start
init();
</script>

</body>
</html>
