<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets</title>

    <style>
        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        #searchInput {
            flex: 1;
            min-width: 260px;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .btn-create {
            background: #198754;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-create:hover {
            background: #157347;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f4f4f4;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        button {
            padding: 7px 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            margin-right: 6px;
        }

        .btn-view {
            background: #0d6efd;
            color: white;
        }

        .btn-view:hover {
            background: #0b5ed7;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            text-transform: capitalize;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-active, .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-page {
            background: #007bff;
            color: white;
        }

        .btn-page:hover:not(:disabled) {
            background: #0056b3;
        }

        .btn-page:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 14px;
            color: #555;
        }

        #noResults {
            text-align: center;
            padding: 30px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Projets</h2>

    <div class="controls">
        <input
            type="text"
            id="searchInput"
            placeholder="Rechercher par ID de projet, nom ou client..."
        />
        <a href="create-project.html" class="btn-create">+ Créer un projet</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID du projet</th>
                <th>Nom</th>
                <th>Client</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="projectsTable"></tbody>
    </table>

    <div id="noResults">Aucun projet trouvé.</div>

    <div class="pagination">
        <button class="btn-page" id="prevBtn" onclick="changePage(-1)">← Précédent</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="btn-page" id="nextBtn" onclick="changePage(1)">Suivant →</button>
    </div>
</div>

<script src="../nav/nav.js"></script>

<script>
const GET_API   = "http://192.168.99.10:8000/projects";
const PAGE_SIZE = 50;

let allProjects     = [];
let filteredProjects = [];
let currentPage     = 1;

const tbody       = document.getElementById("projectsTable");
const searchInput = document.getElementById("searchInput");
const pageInfo    = document.getElementById("pageInfo");
const prevBtn     = document.getElementById("prevBtn");
const nextBtn     = document.getElementById("nextBtn");
const noResults   = document.getElementById("noResults");

async function loadProjects() {
    try {
        const response = await fetch(GET_API);
        const data = await response.json();

        // Your API returns a plain array
        allProjects = Array.isArray(data) ? data : (data.projects || []);

        applyFilterAndRender();
    } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="5">Échec du chargement des projets.</td></tr>`;
    }
}

function applyFilterAndRender() {
    const query = searchInput.value.trim().toLowerCase();

    filteredProjects = allProjects.filter(p => {
        const id     = String(p.project_id || "").toLowerCase();
        const name   = String(p.name || "").toLowerCase();
        const client = String(p.client_name || "").toLowerCase();
        return id.includes(query) || name.includes(query) || client.includes(query);
    });

    currentPage = 1;
    renderPage();
}

function renderPage() {
    const total = filteredProjects.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * PAGE_SIZE;
    const end   = start + PAGE_SIZE;
    const pageItems = filteredProjects.slice(start, end);

    tbody.innerHTML = "";

    if (pageItems.length === 0) {
        noResults.style.display = "block";
    } else {
        noResults.style.display = "none";

        pageItems.forEach(project => {
            const statusClass = `status-${(project.status || "").toLowerCase()}`;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td style="font-size:13px;">${project.project_id}</td>
                <td>${project.name || "-"}</td>
                <td>${project.client_name || "-"}</td>
                <td>
                    <span class="status ${statusClass}">
                        ${project.status || "-"}
                    </span>
                </td>
                <td>
                    <button class="btn-view" onclick="openProject('${project.project_id}')">
                        Voir / Modifier
                    </button>
                    <button class="btn-delete" onclick="deleteProject('${project.project_id}')">
                        Supprimer
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    pageInfo.textContent = total === 0
        ? "Aucun projet"
        : `Affichage de ${start + 1}–${Math.min(end, total)} sur ${total}  •  Page ${currentPage} sur ${totalPages}`;

    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
}

function changePage(delta) {
    currentPage += delta;
    renderPage();
}

function openProject(projectId) {
    // Combined View + Edit page (we will create this next)
    window.location.href = `project-details.html?id=${projectId}`;
}

async function deleteProject(projectId) {
    if (!confirm("Êtes-vous sûr de vouloir supprimer ce projet ?\nCette action est irréversible.")) {
        return;
    }

    try {
        const response = await fetch(`${GET_API}/${projectId}`, {
            method: "DELETE"
        });

        if (!response.ok) {
            throw new Error("Delete failed");
        }

        // Remove from local list
        allProjects = allProjects.filter(p => p.project_id !== projectId);
        applyFilterAndRender();

        alert("Projet supprimé avec succès");
    } catch (err) {
        console.error(err);
        alert("Impossible de supprimer le projet. L'endpoint de suppression n'est peut-être pas encore disponible.");
    }
}

// Live search
searchInput.addEventListener("input", applyFilterAndRender);

// Initial load
loadProjects();
</script>

</body>
</html>
